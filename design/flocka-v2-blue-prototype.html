  const p = allPieces(s).find(x => x.kind === opening.kind && x.id === opening.id);
  const [guess, setGuess] = useState(null);

  const hit = guess === p.card;
  const after = guess ? derive(withOpened(s, p, guess)).cards[p.card] : null;
  const becameConfirmed = after && after.confirmed && !dNow.cards[p.card].confirmed;
  const label = hit ? '的中！' : s.self.includes(p.card) ? '予想外！' : '新発見！';
  const commit = () => {
    update(x => { const q = (p.kind === 'vibe' ? x.vibes : x.proofs).find(y => y.id === p.id); q.opened = true; q.guess = guess; q.guessedAt = now(); });
    setOpening(null); nav.goTab('find');

  return <Portal><div className="overlay-root"><div className="guess" role="dialog" aria-modal="true" aria-label="予想チャレンジ" data-od-id="guess-overlay">
    <div className="row between" style={{ flex: 'none' }}><span className="cap on-muted">予想チャレンジ</span><button className="iconbtn" onClick={() => setOpening(null)} aria-label="あとで開ける" style={{ marginRight: -10 }}><Icon n="x" /></button></div>

/* ================= Decorate a card ================= */
function Deco({ cardKey }) {
  const { s, d, update, nav, toast } = useApp();
  const c = d.cards[cardKey];
  const [tab, setTab] = useState('pattern');
  if (!c) return <main className="view"><Header back title="" /></main>;
  const cur = { pattern: 'burst', frame: 'none', stickers: [], color: 'original', layout: {}, ...(s.deco?.[c.key] || {}) };
  const set = patch => update(x => { x.deco = x.deco || {}; x.deco[c.key] = { ...cur, ...patch }; });
  const addSticker = k => {
    if (cur.stickers.includes(k)) { set({ stickers: cur.stickers.filter(v => v !== k) }); return; }
    if (cur.stickers.length >= 4) return toast('シールは4枚まで。貼っているシールを外すと追加できます');
    const used = cur.stickers.map((v, i) => stickerLayout(cur, v, i).position);
    const position = STICKER_POS.find(([v]) => !used.includes(v))?.[0] || 'br';
    set({ stickers: [...cur.stickers, k], layout: { ...cur.layout, [k]: { position, size: 23, angle: 12 } } });
  };
  const hue = DECO_COLORS.find(x => x[0] === cur.color)?.[2] ?? c.h;
  return <main className="view deco-view" data-od-id="s11-deco">
    <Header back title="カードをデコる" right={<button className="link" onClick={() => { update(x => { if (x.deco) delete x.deco[c.key]; }); }}>元に戻す</button>} />
    <div className="deco-preview" data-od-id="deco-card-preview"><GCard c={{ ...c, deco: cur }} style={{ height: '100%', aspectRatio: '0.78', width: 'auto' }} /></div>
    <div className="seg" role="group" aria-label="デコの種類">{[['pattern', '模様'], ['frame', 'フレーム'], ['stickers', 'シール'], ['color', '色']].map(([k, l]) => <button key={k} aria-pressed={tab === k} onClick={() => setTab(k)} data-od-id={`deco-tab-${k}`}>{l}</button>)}</div>

      <div className="deco-grid" role="group" aria-label="選ぶ" data-od-id="deco-options">{(tab === 'color' ? DECO_COLORS : DECO[tab]).map(([k, l, h]) => {

function PR() {
  const { s, d, update, toast, nav, setOpening } = useApp();

  </main>;
  const draft = s.prDraft ?? pr.text;
  let left = shown;
  const render = pr.segs.map((x, i) => {

        : <div className="prdoc-body" onClick={() => setShown(total)} aria-live="polite">{s.prDraft ? s.prDraft.split('\n').map((l, i) => <p key={i}>{l}</p>) : <p style={{ whiteSpace: 'normal' }}>{render}{shown < total && <span className="caret" />}</p>}</div>}

// Decorative QR-style code (25×25 modules, three finder patterns) seeded from the profile name.
function QRArt({ seed }) {
  const N = 25; let h = 2166136261; for (const ch of seed || 'flocka') h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; };
  const finder = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  const cells = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!finder(x, y) && rnd() > .52) cells.push(<rect key={`${x}-${y}`} x={x} y={y} width="1" height="1" />);
  const eye = (x, y) => <g key={`e${x}${y}`}><rect x={x} y={y} width="7" height="7" /><rect x={x + 1} y={y + 1} width="5" height="5" fill="var(--paper)" /><rect x={x + 2} y={y + 2} width="3" height="3" /></g>;
  return <svg viewBox={`-1 -1 ${N + 2} ${N + 2}`} className="qr-art" role="img" aria-label="あなたの交換用QRコード" shapeRendering="crispEdges"><g fill="var(--ink)">{cells}{eye(0, 0)}{eye(N - 7, 0)}{eye(0, N - 7)}</g></svg>;
}
function Scan() {
  const { s } = useApp();
  const start = useStartExchange();
  const [mode, setMode] = useState('show');
  const peers = Object.keys(PEOPLE).filter(id => !s.blocked.includes(id));
  const target = peers.find(id => !s.connections.some(c => c.peerId === id && c.status === 'accepted')) || peers[0];
  useEffect(() => {
    if (mode !== 'read' || !target) return;
    const t = setTimeout(() => start(target), 2200);
    return () => clearTimeout(t);
  }, [mode, target]);

      <div className="auth-links">
        <button className="link" disabled={wait > 0} onClick={() => { setWait(30); toast('コードを再送しました'); }} data-od-id="auth-resend">{wait > 0 ? `再送まで${wait}秒` : 'コードを再送'}</button>
        <button className="link" onClick={() => go('signup')}>メールアドレスを変更</button>
      </div>
    </div>
    <footer className="onb-foot"><button className="btn btn-go btn-block" disabled={code.length !== 6} onClick={() => { signIn('email', email.trim()); toast('登録が完了しました'); }} data-od-id="auth-verify-submit">確認して次へ</button></footer>
  </main>;

  if (view === 'reset') return <main className="view onb auth" data-od-id="s00-reset">
    {head('login', 'パスワードの再設定')}
    <div className="onb-body">
      <div className="onb-intro"><h1 className="h1">再設定用のリンクを<br />メールで送ります。</h1><p className="small on-muted onb-lead">登録したメールアドレスを入力してください。</p></div>
      <label className="onb-section"><span className="onb-label">メールアドレス</span><input className="input" type="email" inputMode="email" autoComplete="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="例：haru@example.com" /></label>
    </div>
    <footer className="onb-foot"><button className="btn btn-go btn-block" disabled={!emailOk} onClick={() => { toast('再設定用のリンクを送りました'); go('login'); }} data-od-id="auth-reset-submit">リンクを送る</button></footer>
  </main>;

  return <main className="view onb auth" data-od-id="s00-login">
    {head('welcome', 'ログイン')}
    <div className="onb-body">
      <SocialRow />
      <label className="onb-section"><span className="onb-label">メールアドレス</span><input className="input" type="email" inputMode="email" autoComplete="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="例：haru@example.com" /></label>
      <PasswordField value={pw} onChange={setPw} autoComplete="current-password" />
      <button className="link auth-forgot" onClick={() => go('reset')} data-od-id="auth-forgot">パスワードを忘れた方</button>
    </div>
    <footer className="onb-foot"><button className="btn btn-go btn-block" disabled={!(emailOk && pw)} onClick={() => { signIn('email', email.trim()); toast('ログインしました'); }} data-od-id="auth-login-submit">ログイン</button></footer>
  </main>;
}

function Onboarding() {
  const { s, update, nav, toast } = useApp();
  const [step, setStep] = useState(EMBED === 'onboarding' ? 3 : 0);
  const [name, setName] = useState(s.profile.name);
  const [role, setRole] = useState(s.profile.role || '');
  const [interests, setInterests] = useState(s.profile.interests || []);
  const [avatar, setAvatar] = useState({ type: 'initial', color: AV_COLORS[0], motif: 'rocket', ...(s.profile.avatar || {}) });
  const [moreOpen, setMoreOpen] = useState(false);
  const fileRef = useRef();
  const [sel, setSel] = useState(s.self);
  const quickInterests = ['Web開発', 'UI/UX', 'AI・データ', 'モバイル', 'ゲーム', 'グラフィック', '写真', '音楽', 'アニメ', '旅行', '料理', 'スポーツ'];
  const moreCount = interests.filter(i => !quickInterests.includes(i)).length;
  const interestChoice = i => <button key={i} data-od-id={`onboarding-interest-${INTERESTS.indexOf(i)}`} className="choice" aria-pressed={interests.includes(i)} onClick={() => setInterests(v => v.includes(i) ? v.filter(x => x !== i) : [...v, i])}>{i}</button>;
  const can = step === 0 ? name.trim() : step === 3 ? sel.length >= 2 : true;
  const finish = () => { update(x => { x.profile = { ...x.profile, name: name.trim(), role: role.trim(), interests, avatar }; x.self = sel; x.onboarded = true; }); nav.reset(); toast('デッキができた！'); };
  const preview = sel.map(k => ({ key: k, ...CARDS[k], self: true, testimonies: [], givers: [], confirmed: false, discovered: false }));
  const avatarFace = size => <span className="avatar me onb-avatar" style={{ background: avatar.color, '--s': `${size}px` }} role="img" aria-label="設定中のアイコン">{avatar.type === 'photo' && avatar.photo ? <img src={avatar.photo} alt="選択したプロフィール写真" /> : avatar.type === 'motif' ? <Motif k={avatar.motif} /> : name.trim().slice(0, 1)}</span>;
  const STEPS = [
    { label: 'ニックネーム', title: <>はじめまして。<br />ニックネームは？</>, lead: '仲間に表示される名前です。あとから変更できます。', cta: '次へ' },
    { label: 'アイコン', title: <>あなたの顔になる<br />アイコンを選ぼう。</>, lead: '任意です。あとから変更できます。', cta: '次へ' },
    { label: 'ひとこと・関心', title: <>あなたらしさを、<br />もう少し。</>, lead: 'どちらも任意です。話のきっかけになります。', cta: '次へ' },
    { label: '強みカード', title: <>自分の強みだと思う<br />カードを2〜3枚。</>, lead: '迷ったら直感で。あとから選び直せます。', cta: '次へ' },
    { label: 'しくみ', title: <>仲間の証言で、<br />カードが本物になる。</>, lead: '今は「自己申告」。2人以上の証言で「確認済み」になり、自己PRの文章が書けます。', cta: '内容を確認する' },
    { label: '確認', title: <>このプロフィールで、<br />はじめよう。</>, lead: 'あとから変更できます。', cta: 'この内容ではじめる' },
  ];
  const last = STEPS.length - 1;
  const cur = STEPS[step];
  const go = n => setStep(n);
  const shownInterests = interests.slice(0, 5);
  return <main className="view onb" data-od-id="s01-onboarding">
    <header className="onb-head" data-od-id="onboarding-header">
      {step > 0 ? <button className="iconbtn" onClick={() => go(step - 1)} aria-label="前のステップに戻る" data-od-id="onboarding-back"><Icon n="back" /></button> : <img className="onb-brand" src="flocka-app-icon-fsticker-1024.svg" width="40" height="40" alt="Flocka" data-od-id="onboarding-brand" />}
      <div className="onb-progress" role="progressbar" aria-valuemin={1} aria-valuemax={STEPS.length} aria-valuenow={step + 1} aria-label={`ステップ ${step + 1} / ${STEPS.length}：${cur.label}`} data-od-id="onboarding-progress">{STEPS.map((_, i) => <i key={i} className={i < step ? 'done' : i === step ? 'now' : ''} />)}</div>
      <span className="chip"><b>{step + 1}</b>/ {STEPS.length}</span>
    </header>
    <div key={step} className="onb-body" data-od-id={`onboarding-step-${step + 1}`}>
      <div className="onb-intro" data-od-id="onboarding-intro">
        <p className="onb-eyebrow">STEP {String(step + 1).padStart(2, '0')}<span aria-hidden="true">／</span>{cur.label}</p>
        <h1 className="h1" data-od-id="onboarding-title">{cur.title}</h1>
        <p className="small on-muted onb-lead">{cur.lead}</p>
      </div>

      {step === 0 && <label className="onb-section" data-od-id="onboarding-name">
        <span className="onb-label">ニックネーム<em>16文字まで</em></span>
        <input className="input" value={name} maxLength={16} autoFocus onChange={e => setName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && can) go(1); }} placeholder="例：ハル" />
      </label>}

      {step === 1 && <div className="onb-section" data-od-id="onboarding-avatar">
        <div className="onb-avatar-wrap">{avatarFace(80)}</div>
        <div className="seg" role="group" aria-label="アイコンの種類">{[['initial', '頭文字'], ['motif', 'イラスト'], ['photo', '写真']].map(([k, l]) => <button key={k} data-od-id={`onboarding-avatar-${k}`} style={{ minHeight: 44 }} aria-pressed={avatar.type === k} onClick={() => k === 'photo' && !avatar.photo ? fileRef.current?.click() : setAvatar(v => ({ ...v, type: k }))}>{l}</button>)}</div>
        <input ref={fileRef} type="file" accept="image/*" className="sr" aria-label="プロフィール写真を選ぶ" onChange={e => { const f = e.target.files?.[0]; if (f) readPhoto(f, photo => setAvatar(v => ({ ...v, type: 'photo', photo }))); e.target.value = ''; }} />
        {avatar.type === 'motif' && <div className="onb-motifs" role="group" aria-label="イラスト">{AV_MOTIFS.map(([k, l]) => <button key={k} data-od-id={`onboarding-motif-${k}`} className="onb-motif" aria-pressed={avatar.motif === k} aria-label={l} title={l} onClick={() => setAvatar(v => ({ ...v, motif: k }))}><Motif k={k} /></button>)}</div>}
        {avatar.type === 'photo' ? <button className="btn btn-plain btn-block" data-od-id="onboarding-photo-change" onClick={() => fileRef.current?.click()}>別の写真を選ぶ</button> : <><span className="onb-label">背景色</span><div className="onb-swatches" role="group" aria-label="アイコンの背景色">{AV_COLORS.map((col, i) => <button key={col} data-od-id={`onboarding-avatar-color-${i}`} className="swatch-btn" aria-pressed={avatar.color === col} aria-label={`${AV_COLOR_NAMES[i]}にする`} style={{ background: col }} onClick={() => setAvatar(v => ({ ...v, color: col }))} />)}</div></>}
      </div>}

      {step === 2 && <>
        <label className="onb-section" data-od-id="onboarding-message">
          <span className="onb-label">ひとこと<em>{role.length}/24</em></span>
          <input className="input" value={role} maxLength={24} onChange={e => setRole(e.target.value)} placeholder="今やっていることや、好きなこと" />
        </label>
        <div className="onb-section" data-od-id="onboarding-interests">
          <span className="onb-label">関心<em>{interests.length ? `${interests.length}件選択中` : '複数選べます'}</em></span>
          <div className="choices onb-chips">{quickInterests.map(interestChoice)}</div>
          <button className="link onb-more" data-od-id="onboarding-interests-more" onClick={() => setMoreOpen(true)}>ほかの関心を選ぶ{moreCount > 0 ? `（${moreCount}件選択中）` : ''}</button>
        </div>
        {moreOpen && <Sheet title="ほかの関心" onClose={() => setMoreOpen(false)}>
          <div className="choices onb-chips">{INTERESTS.filter(i => !quickInterests.includes(i)).map(interestChoice)}</div>
          <button className="btn btn-go btn-block" style={{ marginTop: 18 }} data-od-id="onboarding-interests-done" onClick={() => setMoreOpen(false)}>決定</button>
        </Sheet>}
      </>}

      {step === 3 && <CardPicker sel={sel} setSel={setSel} paged />}

      {step === 4 && <div className="onb-section" data-od-id="onboarding-preview">
        <span className="onb-label">あなたのデッキ<em>自己申告 {preview.length}枚</em></span>
        <div className="deck onb-deck" style={{ gridTemplateColumns: `repeat(${Math.max(preview.length, 1)}, 1fr)` }}>{preview.map(c => <GCard key={c.key} c={c} />)}</div>
      </div>}

      {step === 5 && <div className="list onb-review" data-od-id="onboarding-review">
        <div className="onb-review-id" data-od-id="onboarding-review-identity">
          {avatarFace(56)}
          <h2 className="h3">{name.trim()}</h2>
          <button className="link" data-od-id="onboarding-review-name-edit" onClick={() => go(0)} aria-label="ニックネームを変更">変更</button>
        </div>
        <div className="onb-row" data-od-id="onboarding-review-message">
          <p className="cap muted">ひとこと</p><button className="link" onClick={() => go(2)} aria-label="ひとことを変更">変更</button>
          <p className="small">{role.trim() || <span className="muted">未設定</span>}</p>
        </div>
        <div className="onb-row" data-od-id="onboarding-review-interests">
          <p className="cap muted">関心</p><button className="link" onClick={() => go(2)} aria-label="関心を変更" data-od-id="onboarding-review-profile-edit">変更</button>
          {interests.length ? <div className="choices">{shownInterests.map(i => <span key={i} className="interest-chip">{i}</span>)}{interests.length > shownInterests.length && <span className="interest-chip">+{interests.length - shownInterests.length}</span>}</div> : <p className="small muted">未選択</p>}
        </div>
        <div className="onb-row" data-od-id="onboarding-review-strengths">
          <p className="cap muted">自己申告カード</p><button className="link" onClick={() => go(3)} aria-label="カードを選び直す" data-od-id="onboarding-review-strength-edit">変更</button>
          <div className="choices">{sel.map(k => <span key={k} className="interest-chip" data-od-id={`onboarding-review-strength-${k}`}>{CARDS[k].name}</span>)}</div>
        </div>
      </div>}
    </div>
    <footer className="onb-foot" data-od-id="onboarding-footer">
      <button className="btn btn-go btn-block" data-od-id="onboarding-next" disabled={!can} onClick={() => step < last ? go(step + 1) : finish()}>{cur.cta}</button>
    </footer>
  </main>;
}

/* ================= App shell ================= */
const ROOTS = { find: 'deck', exchange: 'exchange', pr: 'pr' };
const initNav = () => ({ tab: 'find', stacks: { find: [{ id: 'deck' }], exchange: [{ id: 'exchange' }], pr: [{ id: 'pr' }] } });
const SCREENS = { deck: Deck, card: CardDetail, deco: Deco, avatar: AvatarEdit, exchange: Exchange, connections: Connections, nearby: Nearby, scan: Scan, confirm: Confirm, give: Give, memo: Memo, piece: PieceDetail, pieces: Pieces, me: Me, selfEdit: SelfEdit, settings: Settings, pr: PR };
const FOCUSED = ['give', 'memo', 'scan', 'confirm', 'nearby'];
function demoState() {
  const x = fresh(), at = h => new Date(Date.now() - h * 3600e3).toISOString();
  x.profile = { name: 'ハルカ', role: 'ハッカソンでよく実装担当', interests: ['Web開発', 'チーム開発', 'AI・データ'], links: { github: '' }, avatar: { type: 'initial', color: 'oklch(0.9 0.17 98)' } };
  x.self = ['impl', 'focus'];
  x.account = { method: 'email', email: 'haruka@example.com', createdAt: at(48) };
  if (EMBED === 'onboarding') return x;
  x.onboarded = true;
  const ctx = { 'mock-a': ['学内ハッカソン', '同じチームでUIを担当'], 'mock-b': ['学内ハッカソン', '発表資料を一緒に作った'], 'mock-c': ['開発勉強会', '懇親会で隣の席だった'] };
  x.connections = Object.keys(ctx).map((id, i) => ({ id: 'c-' + id, peerId: id, status: 'accepted', myApproved: true, vibe: null, later: false, mock: true, exchangedAt: at(30 - i), context: { place: ctx[id][0], trigger: ctx[id][1] } }));
  const v = (id, fromId, card, label, text, opened, guess, h) => ({ id, fromId, card, label, text, opened, guess, visibility: 'private', createdAt: at(h) });
  x.vibes = [
    v('v1', 'mock-a', 'bridge', '分かりやすく伝えてくれる', 'UIの相談をしたら、技術の話をかみ砕いて説明してくれた', true, 'impl', 20),
    v('v2', 'mock-b', 'bridge', '分かりやすく伝えてくれる', '発表の前に、みんなの意見を整理してまとめてくれた', true, 'focus', 18),
    v('v3', 'mock-a', 'impl', '手を動かすのが速い', '話したアイデアを、その日のうちに動く形にしてくれた', true, 'impl', 16),
    v('v4', 'mock-c', 'warm', '話しやすい', '初対面なのに、緊張せずに話せた', false, null, 2),
  ];
  return x;
}
function loadState() { if (EMBED) return demoState(); try { const v = JSON.parse(store.get(KEY)); return v && v.schemaVersion === 1 && v.profile ? { ...fresh(), ...v } : fresh(); } catch (_) { return fresh(); } }
function embedNav() {
  const n = initNav();
  if (EMBED === 'card') n.stacks.find.push({ id: 'card', params: { key: 'bridge' } });
  if (EMBED === 'exchange') n.tab = 'exchange';
  if (EMBED === 'give') { n.tab = 'exchange'; n.stacks.exchange.push({ id: 'give', params: { cid: 'c-mock-b' } }); }
  if (EMBED === 'pr') n.tab = 'pr';
  return n;
}
function loadNav() { if (EMBED) return embedNav(); try { const v = JSON.parse(store.get(NAVKEY)); return v && v.stacks && ROOTS[v.tab] && Object.keys(ROOTS).every(k => v.stacks[k]?.length && SCREENS[v.stacks[k].at(-1).id]) ? v : initNav(); } catch (_) { return initNav(); } }

function App() {
  const [s, setS] = useState(loadState);
  const [navS, setNav] = useState(loadNav);
  const [t, setT] = useState(null);
  const [opening, setOpening] = useState(EMBED === 'guess' ? { kind: 'vibe', id: 'v4' } : null);
  const tRef = useRef();
  useEffect(() => { store.set(KEY, JSON.stringify(s)); }, [s]);
  useEffect(() => { store.set(NAVKEY, JSON.stringify(navS)); }, [navS]);
  const update = fn => setS(prev => { const x = JSON.parse(JSON.stringify(prev)); fn(x); return x; });
  const toast = (msg, opt) => { clearTimeout(tRef.current); const act = typeof opt === 'function' ? { label: '取り消す', fn: opt } : opt; setT({ msg, act, k: Date.now() }); tRef.current = setTimeout(() => setT(null), act ? 5000 : 2600); };
  const mod = fn => setNav(n => { const x = JSON.parse(JSON.stringify(n)); fn(x); return x; });
  const nav = {
    push: (id, params) => mod(x => { x.stacks[x.tab].push({ id, params }); }),
    replace: (id, params) => mod(x => { const st = x.stacks[x.tab]; st[st.length - 1] = { id, params }; }),
    pop: () => mod(x => { const st = x.stacks[x.tab]; if (st.length > 1) st.pop(); }),
    popTo: id => mod(x => { const st = x.stacks[x.tab]; while (st.length > 1 && st[st.length - 1].id !== id) st.pop(); }),
    goTab: (tab, entry) => mod(x => { x.tab = tab; x.stacks[tab] = [{ id: ROOTS[tab] }]; if (entry) x.stacks[tab].push(entry); }),
    tab: tab => mod(x => { if (x.tab === tab) x.stacks[tab] = [{ id: ROOTS[tab] }]; x.tab = tab; }),
    reset: () => setNav(initNav()),
  };
  const d = derive(s);
  const ctx = { s, d, update, nav, toast, opening, setOpening };
  const stack = navS.stacks[navS.tab];
  const top = stack[stack.length - 1];
  const Screen = SCREENS[top.id] || Deck;
  const params = (top.id === 'card' || top.id === 'deco') ? { cardKey: top.params?.key } : (top.params || {});
  const showTabs = s.account && s.onboarded && !FOCUSED.includes(top.id);
  const TABS = [['find', 'デッキ', 'deck'], ['exchange', '交換', 'swap'], ['pr', '自己PR', 'doc']];
  return <Ctx.Provider value={ctx}>
    {!s.account ? <Auth /> : !s.onboarded ? <Onboarding /> : <Screen key={navS.tab + stack.length + top.id + JSON.stringify(top.params || {})} {...params} />}
    {showTabs && <nav className="tabbar" aria-label="メインナビゲーション">{TABS.map(([k, l, ic]) =>
      <button key={k} className="tab" aria-current={navS.tab === k ? 'page' : undefined} onClick={() => nav.tab(k)} data-od-id={`tab-${k}`} aria-label={k === 'find' && d.unopened.length ? `${l}（封筒${d.unopened.length}通）` : l}>
        <Icon n={ic} />{k === 'find' && d.unopened.length > 0 && <span className="tab-dot" aria-hidden="true">{d.unopened.length}</span>}{k === 'pr' && d.prCard && <span className="tab-dot" aria-hidden="true">!</span>}{l}
      </button>)}</nav>}
    {opening && <GuessOverlay key={opening.kind + opening.id} />}
    {t && <div className={`toast ${showTabs ? 'over-tabs' : 'over-cta'}`} role="status" key={t.k} data-od-id="toast"><span className="toast-msg" onClick={() => setT(null)}>{t.msg}</span>{t.act && <button className="link" onClick={() => { t.act.fn(); setT(null); }}>{t.act.label}</button>}</div>}
  </Ctx.Provider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
